<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bitcoin Countdown - OBS Source</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d1115;
      font-family: 'Chakra Petch', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    /* Container no estilo da moldura do layout */
    .obs-hud-container {
      position: relative;
      width: 92%;
      max-width: 820px;
      padding: 40px 30px;
      background: rgba(13, 17, 21, 0.95);
      border-radius: 18px;
      border: 1px solid rgba(247, 147, 26, 0.15);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(247, 147, 26, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Cantos em L (brackets) fiéis ao layout anexo */
    .corner {
      position: absolute;
      width: 32px;
      height: 32px;
      border-color: #F7931A;
      pointer-events: none;
    }
    .top-left {
      top: 14px;
      left: 14px;
      border-top: 4px solid #F7931A;
      border-left: 4px solid #F7931A;
      border-top-left-radius: 10px;
    }
    .bottom-left {
      bottom: 14px;
      left: 14px;
      border-bottom: 4px solid #F7931A;
      border-left: 4px solid #F7931A;
      border-bottom-left-radius: 10px;
    }
    .top-right {
      top: 14px;
      right: 14px;
      border-top: 4px solid #F7931A;
      border-right: 4px solid #F7931A;
      border-top-right-radius: 10px;
    }
    .bottom-right {
      bottom: 14px;
      right: 14px;
      border-bottom: 4px solid #F7931A;
      border-right: 4px solid #F7931A;
      border-bottom-right-radius: 10px;
    }

    /* Cabeçalho */
    .hud-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(247, 147, 26, 0.15);
      border: 1px solid #F7931A;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #F7931A;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #F7931A;
      box-shadow: 0 0 10px #F7931A;
      animation: pulse 1.2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.4; }
    }

    .title-label {
      font-size: 1.15rem;
      font-weight: 700;
      color: #d1d5db;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Visor Central */
    .timer-center {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
    }

    .progress-svg {
      transform: rotate(-90deg);
      filter: drop-shadow(0 0 12px rgba(247, 147, 26, 0.35));
    }

    .progress-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 10;
    }

    .progress-bar {
      fill: none;
      stroke: #F7931A;
      stroke-width: 10;
      stroke-linecap: round;
      stroke-dasharray: 816.8; /* 2 * PI * 130 */
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
    }

    .timer-text-wrap {
      position: absolute;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .timer-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 5rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(247, 147, 26, 0.45);
      line-height: 1;
    }

    .timer-sub {
      margin-top: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 2px;
      color: #9ca3af;
      text-transform: uppercase;
    }

    /* Barra inferior e equalizador de áudio */
    .hud-footer {
      width: 100%;
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .bar-line-wrap {
      width: 80%;
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(247, 147, 26, 0.2);
    }

    .bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #F7931A, #ffba59);
      box-shadow: 0 0 8px #F7931A;
      transition: width 1s linear;
    }

    .audio-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      color: #9ca3af;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .eq-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 14px;
    }

    .eq-bars span {
      width: 3px;
      background: #F7931A;
      border-radius: 1px;
      animation: eq 1s ease-in-out infinite alternate;
    }
    .eq-bars span:nth-child(1) { height: 40%; animation-delay: 0.1s; }
    .eq-bars span:nth-child(2) { height: 90%; animation-delay: 0.4s; }
    .eq-bars span:nth-child(3) { height: 60%; animation-delay: 0.2s; }
    .eq-bars span:nth-child(4) { height: 100%; animation-delay: 0.5s; }
    .eq-bars span:nth-child(5) { height: 35%; animation-delay: 0.3s; }

    @keyframes eq {
      0% { height: 20%; }
      100% { height: 100%; }
    }
  </style>
</head>
<body>

  <div class="obs-hud-container">
    <!-- Cantos angulares idênticos ao template -->
    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <div class="hud-header">
      <div class="badge-live">
        <span class="badge-dot"></span>
        Iniciando
      </div>
      <span class="title-label">Bitcoin Amantikir</span>
    </div>

    <!-- Círculo e Cronômetro -->
    <div class="timer-center">
      <svg class="progress-svg" width="300" height="300" viewBox="0 0 300 300">
        <circle class="progress-bg" cx="150" cy="150" r="130"></circle>
        <circle id="progressCircle" class="progress-bar" cx="150" cy="150" r="130"></circle>
      </svg>
      <div class="timer-text-wrap">
        <div class="timer-display" id="timer">05:00</div>
        <div class="timer-sub" id="loopCounter">Loop: #1</div>
      </div>
    </div>

    <!-- Barra de progresso horizontal e status do Lofi -->
    <div class="hud-footer">
      <div class="bar-line-wrap">
        <div class="bar-fill" id="barFill"></div>
      </div>
      <div class="audio-indicator">
        <div class="eq-bars">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <span>Lo-Fi Chill Stream • 24/7 Autoplay</span>
      </div>
    </div>
  </div>

  <!-- Elemento de áudio com stream Lofi (Livre de direitos / CC) -->
  <audio id="lofiAudio" preload="auto" loop playsinline>
    <source src="https://live.hunter.fm/lofi_high" type="audio/mpeg">
    <source src="https://stream.zeno.fm/f3wvbbqmdg8uv" type="audio/mpeg">
  </audio>

  <script>
    const TOTAL_SECONDS = 5 * 60; // 5 minutos
    let remainingSeconds = TOTAL_SECONDS;
    let cycles = 1;

    const timerEl = document.getElementById('timer');
    const loopCounterEl = document.getElementById('loopCounter');
    const circleEl = document.getElementById('progressCircle');
    const barEl = document.getElementById('barFill');
    const audio = document.getElementById('lofiAudio');

    const CIRCUMFERENCE = 2 * Math.PI * 130; // ~816.81
    circleEl.style.strokeDasharray = CIRCUMFERENCE;

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateDisplay() {
      timerEl.textContent = formatTime(remainingSeconds);
      
      const progress = remainingSeconds / TOTAL_SECONDS;
      const offset = CIRCUMFERENCE * (1 - progress);
      circleEl.style.strokeDashoffset = offset;
      barEl.style.width = `${progress * 100}%`;
    }

    function startTimer() {
      updateDisplay();
      setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
        } else {
          // Quando chega a 0, reinicia automaticamente para 5 minutos
          cycles++;
          loopCounterEl.textContent = `Loop: #${cycles}`;
          remainingSeconds = TOTAL_SECONDS;
        }
        updateDisplay();
      }, 1000);
    }

    // Iniciar áudio automaticamente no carregamento da fonte OBS
    function startAudio() {
      audio.volume = 0.6; // Volume ideal para stream (60%)
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          // Fallback caso alguma política de autoplay do Chromium bloqueie
          window.addEventListener('click', () => audio.play(), { once: true });
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      startTimer();
      startAudio();
    });
  </script>
</body>
</html>
