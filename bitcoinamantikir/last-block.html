<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Último Bloco Bitcoin - Mempool</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f1e9d2;
      color: #1a2321;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: fit-content;
      max-width: 360px;
    }

    .card {
      background: #1c1a17;
      border: 2px solid #2d3e38;
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .header {
      border-bottom: 1px solid #322e28;
      padding-bottom: 8px;
      margin-bottom: 10px;
      text-align: center;
    }

    .header h1 {
      font-size: 0.85rem;
      color: #e5dac1;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .loading, .error {
      text-align: center;
      padding: 10px;
      font-size: 0.85rem;
      color: #b8ac96;
    }

    .error {
      color: #e76f51;
    }

    .block-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background-color: #12110f;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #e7801a;
    }

    .block-height {
      font-weight: 800;
      font-size: 1.1rem;
      color: #f29100;
      white-space: nowrap;
    }

    .block-height span {
      color: #8c8272;
      font-weight: 500;
      font-size: 0.8rem;
      margin-right: 2px;
    }

    .block-time {
      font-size: 0.85rem;
      color: #d1c5ad;
      font-weight: 600;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <div class="header">
        <h1>Último Bloco Minerado</h1>
      </div>
      
      <div id="content">
        <div class="loading">Carregando...</div>
      </div>
    </div>
  </div>

  <script>
    // Guarda a altura do bloco atualmente exibido na interface
    let currentBlockHeight = null;

    async function fetchLastBlock() {
      const contentEl = document.getElementById('content');
      
      try {
        // 1. Obtém a altura do último bloco
        const tipResponse = await fetch('https://mempool.space/api/blocks/tip/height');
        if (!tipResponse.ok) throw new Error('Erro na altura.');
        const lastBlockHeight = (await tipResponse.text()).trim();

        // Se a informação não mudou, interrompe a execução em background silenciosamente
        if (lastBlockHeight === currentBlockHeight) {
          return;
        }

        // 2. Obtém a HASH a partir da altura
        const hashResponse = await fetch(`https://mempool.space/api/block-height/${lastBlockHeight}`);
        if (!hashResponse.ok) throw new Error('Erro na hash.');
        const blockHash = (await hashResponse.text()).trim();

        // 3. Obtém os detalhes completos
        const blockResponse = await fetch(`https://mempool.space/api/block/${blockHash}`);
        if (!blockResponse.ok) throw new Error('Erro nos detalhes.');
        const blockData = await blockResponse.json();

        // Atualiza a variável com a nova altura
        currentBlockHeight = lastBlockHeight;

        // Atualiza a interface
        contentEl.innerHTML = `
          <div class="block-item">
            <div class="block-height">
              <span>#</span>${blockData.height}
            </div>
            <div class="block-time">
              ${formatTimestampGmtMinus3(blockData.timestamp)}
            </div>
          </div>
        `;

      } catch (err) {
        // Só exibe a mensagem de erro se ainda não houver nenhum bloco na tela
        if (!currentBlockHeight) {
          contentEl.innerHTML = `<div class="error">Falha ao carregar dados</div>`;
        }
      }
    }

    function formatTimestampGmtMinus3(timestamp) {
      if (!timestamp || isNaN(timestamp)) return 'Indisponível';

      const date = new Date(timestamp * 1000);

      const options = {
        timeZone: 'America/Sao_Paulo',
        day: '2-digit',
        month: '2-digit',
        year: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      };

      const formatter = new Intl.DateTimeFormat('pt-BR', options);
      return formatter.format(date).replace(',', '');
    }

    // Execução inicial
    fetchLastBlock();

    // Atualização automática em background a cada 30 segundos (30000 ms)
    setInterval(fetchLastBlock, 30000);
  </script>
</body>
</html>
