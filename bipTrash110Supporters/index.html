<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Tweets</title>
    <style>
        /* CSS para estilizar a página e o grid */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f3f5;
            color: #14171a;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #1da1f2;
            margin-bottom: 30px;
        }

        /* Layout em colunas tipo "Masonry" / Mural */
        #tweet-container {
            max-width: 1200px;
            margin: 0 auto;
            column-count: 3;
            column-gap: 20px;
        }

        /* Evita que o tweet seja cortado no meio entre duas colunas */
        .tweet-wrapper {
            break-inside: avoid;
            page-break-inside: avoid;
            margin-bottom: 20px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 10px;
            transition: transform 0.2s ease-in-out;
        }

        .tweet-wrapper:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        /* Responsividade */
        @media (max-width: 992px) {
            #tweet-container {
                column-count: 2;
            }
        }

        @media (max-width: 600px) {
            #tweet-container {
                column-count: 1;
            }
        }
    </style>
</head>
<body>

    <h1>Coleção de Tweets</h1>
    
    <!-- Contêiner onde o JavaScript vai injetar os tweets -->
    <div id="tweet-container"></div>

    <script>
        // JAVASCRIPT: Lista com os links fornecidos
        const tweets = [
            "https://x.com/SpectrGen/status/2032473366838604061",
            "https://x.com/hoardingsats/status/2077875416560189558",
            "https://x.com/davelund_/status/2079380100374466654",
            "https://x.com/maitreyabtc/status/2082935821527662674",
            "https://x.com/1914ad/status/2068728684001759652",
            "https://x.com/CunyRenaud/status/2061412032604180725",
            "https://x.com/BitcoinerPR/status/2085785884712989143",
            "https://x.com/Einsamwolf58184/status/2084999940183380335",
            "https://x.com/BTChieftain/status/2023905469761310796",
            "https://x.com/CoSatoshi821/status/2074625432553398411",
            "https://x.com/f1xtheworld/status/1967422186408587342",
            "https://x.com/_Hugo_Ramos_/status/1973833666917724629",
            "https://x.com/Pledditor/status/1741310113175003554",
            "https://x.com/Singekino_Miner/status/2080424897457840310",
            "https://x.com/DelcinMaria/status/1926932382780686445",
            "https://x.com/MarcanoFilms/status/2020826601085362189",
            "https://x.com/Lightningmaxi/status/1964846230586220795",
            "https://x.com/Lightningmaxi/status/1934620378283860438"
        ];

        const container = document.getElementById('tweet-container');

        // Cria a estrutura HTML necessária para cada link
        tweets.forEach(url => {
            // Cria o embrulho de estilo
            const wrapper = document.createElement('div');
            wrapper.className = 'tweet-wrapper';

            // Cria o blockquote exigido pelo widget do X/Twitter
            const blockquote = document.createElement('blockquote');
            blockquote.className = 'twitter-tweet';
            blockquote.setAttribute('data-theme', 'light'); // Altere para 'dark' se preferir fundo escuro
            blockquote.setAttribute('data-dnt', 'true'); // Do Not Track (Privacidade)
            
            // Cria o link invisível que o script do Twitter converte no cartão
            const link = document.createElement('a');
            // Nota: O widget funciona melhor usando twitter.com em vez de x.com internamente, então fazemos um replace preventivo
            link.href = url.replace('x.com', 'twitter.com');
            
            blockquote.appendChild(link);
            wrapper.appendChild(blockquote);
            container.appendChild(wrapper);
        });

        // Carrega o script oficial do Twitter de forma assíncrona para renderizar os cards
        const script = document.createElement('script');
        script.src = "https://platform.twitter.com/widgets.js";
        script.async = true;
        script.charset = "utf-8";
        document.body.appendChild(script);
    </script>
</body>
</html>
