<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite - Heitor Petra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        /* Custom Styles for Game UI Theme */
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #121f3d;
            background-image: radial-gradient(circle at center, #1e3366 0%, #0a1122 100%);
            min-height: 100vh;
        }

        .font-game {
            font-family: 'Lilita One', cursive;
        }

        /* Text Styles */
        .text-stroke {
            -webkit-text-stroke: 1.5px #000;
            text-shadow: 2px 3px 0 #000;
        }

        .text-stroke-sm {
            -webkit-text-stroke: 1px #000;
            text-shadow: 1px 2px 0 #000;
        }

        /* Wooden Card */
        .card-wood {
            background-color: #5c3a21;
            border: 4px solid #f9c733;
            box-shadow: 
                inset 0 0 10px rgba(0,0,0,0.5),
                0 8px 0 #3a2211,
                0 12px 15px rgba(0,0,0,0.5);
            border-radius: 16px;
            position: relative;
        }
        
        .card-wood::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            pointer-events: none;
        }

        /* Blue Card */
        .card-blue {
            background-color: #1a4a8c;
            border: 4px solid #3c82d6;
            box-shadow: 
                inset 0 0 10px rgba(0,0,0,0.3),
                0 6px 0 #0f2e59,
                0 10px 15px rgba(0,0,0,0.5);
            border-radius: 16px;
        }

        /* Game Buttons */
        .btn-game {
            transition: all 0.1s ease;
            text-transform: uppercase;
            position: relative;
            top: 0;
        }

        .btn-game:active {
            top: 4px;
            box-shadow: 0 0 0 transparent !important;
            transform: translateY(2px);
        }

        .btn-gold {
            background: linear-gradient(to bottom, #ffdf59, #f0a905);
            border: 3px solid #6b4105;
            box-shadow: 0 6px 0 #b37700;
            color: #fff;
            text-shadow: 1px 2px 0 #8c5a00;
        }

        .btn-green {
            background: linear-gradient(to bottom, #4ade80, #16a34a);
            border: 3px solid #064e3b;
            box-shadow: 0 6px 0 #14532d;
            color: #fff;
            text-shadow: 1px 2px 0 #064e3b;
        }

        /* Inputs */
        .input-game {
            background-color: #fff;
            border: 3px solid #3c82d6;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.2);
            color: #1a4a8c;
            transition: border-color 0.2s;
        }
        
        .input-game:focus {
            outline: none;
            border-color: #f9c733;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.2), 0 0 8px rgba(249, 199, 51, 0.6);
        }

        .input-game::placeholder {
            color: #9ca3af;
        }
    </style>
</head>
<body class="py-8 px-4 antialiased text-white flex flex-col items-center">

    <main class="w-full max-w-md mx-auto flex flex-col gap-8">
        
        <!-- Header Image -->
        <div class="relative">
            <div class="absolute inset-0 bg-[#f9c733] rounded-2xl transform translate-y-2 translate-x-1 opacity-50 blur-sm"></div>
            <img src="108067.jpg" alt="Convite Heitor Petra" class="relative w-full rounded-2xl border-4 border-[#f9c733] shadow-2xl z-10 object-cover">
        </div>

        <!-- Event Details Section -->
        <div class="card-wood p-6 text-center z-10">
            <h1 class="font-game text-3xl md:text-4xl text-[#f9c733] text-stroke mb-4 leading-tight">
                Você foi convidado para a festa do Heitor Petra!
            </h1>
            
            <div class="flex flex-col gap-4 mt-6">
                <div class="bg-[#3a2211] rounded-lg p-3 border border-[#85532c] flex items-center shadow-inner">
                    <div class="w-12 h-12 bg-[#f9c733] rounded flex items-center justify-center text-2xl border-2 border-[#b37700] shrink-0">
                        📅
                    </div>
                    <div class="ml-4 text-left">
                        <p class="text-[#f9c733] font-bold text-sm uppercase tracking-wider">Data</p>
                        <p class="text-xl font-bold">24/10/2026</p>
                    </div>
                </div>

                <div class="bg-[#3a2211] rounded-lg p-3 border border-[#85532c] flex items-center shadow-inner">
                    <div class="w-12 h-12 bg-[#f9c733] rounded flex items-center justify-center text-2xl border-2 border-[#b37700] shrink-0">
                        ⏰
                    </div>
                    <div class="ml-4 text-left">
                        <p class="text-[#f9c733] font-bold text-sm uppercase tracking-wider">Horário</p>
                        <p class="text-xl font-bold">15h</p>
                    </div>
                </div>

                <div class="bg-[#3a2211] rounded-lg p-3 border border-[#85532c] flex items-center shadow-inner">
                    <div class="w-12 h-12 bg-[#f9c733] rounded flex items-center justify-center text-2xl border-2 border-[#b37700] shrink-0">
                        📍
                    </div>
                    <div class="ml-4 text-left">
                        <p class="text-[#f9c733] font-bold text-sm uppercase tracking-wider">Onde?</p>
                        <p class="text-base font-bold leading-tight">Rua 24 de Maio, 99<br>Play, Rocha - Rio de Janeiro</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Form Section -->
        <div class="card-blue p-6 z-10">
            <h2 class="font-game text-2xl text-white text-stroke-sm mb-4 text-center">Lista de Convidados</h2>
            <p class="text-sm text-blue-200 text-center mb-5 font-semibold">Adicione o nome das pessoas que irão com você!</p>
            
            <div id="guest-list-container" class="flex flex-col gap-3 mb-6">
                <!-- Initial Input -->
                <div class="relative guest-row">
                    <input type="text" placeholder="Nome do convidado 1" class="input-game w-full p-3 rounded-xl font-bold text-lg" required>
                </div>
            </div>

            <button id="btn-add-guest" class="btn-game btn-gold w-full py-3 rounded-xl font-game text-xl tracking-wide flex items-center justify-center gap-2">
                <span>➕</span> Adicionar mais um
            </button>
        </div>

        <!-- Submit Section -->
        <div class="flex flex-col gap-3 pb-8 z-10">
            <div id="error-message" class="hidden bg-red-500 text-white font-bold p-3 rounded-lg text-center border-2 border-red-700 shadow-lg mb-2">
                Por favor, preencha pelo menos um nome!
            </div>

            <button id="btn-whatsapp" class="btn-game btn-green w-full py-4 rounded-xl font-game text-2xl tracking-wide flex items-center justify-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16" style="filter: drop-shadow(1px 2px 0px #064e3b);">
                    <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
                </svg>
                Confirmar no WhatsApp
            </button>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const guestListContainer = document.getElementById('guest-list-container');
            const btnAddGuest = document.getElementById('btn-add-guest');
            const btnWhatsapp = document.getElementById('btn-whatsapp');
            const errorMessage = document.getElementById('error-message');
            let guestCount = 1;

            // Helper to hide error message when user starts typing
            const hideError = () => {
                errorMessage.classList.add('hidden');
            };

            // Add event listener to initial input to clear errors
            const initialInput = guestListContainer.querySelector('input');
            initialInput.addEventListener('input', hideError);

            // Logic to add a new guest input
            btnAddGuest.addEventListener('click', () => {
                guestCount++;
                
                const wrapper = document.createElement('div');
                wrapper.className = 'relative guest-row animate-fade-in-down';
                wrapper.style.animation = 'fadeIn 0.3s ease-out forwards';
                
                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = `Nome do convidado ${guestCount}`;
                input.className = 'input-game w-full p-3 rounded-xl font-bold text-lg';
                input.addEventListener('input', hideError);

                // Optional: Delete button for extra rows (keeps UI clean)
                const deleteBtn = document.createElement('button');
                deleteBtn.innerHTML = '✖';
                deleteBtn.className = 'absolute right-3 top-1/2 transform -translate-y-1/2 text-red-500 hover:text-red-700 font-bold text-xl drop-shadow-md';
                deleteBtn.onclick = () => {
                    wrapper.remove();
                    // Re-calculate guest placeholders if desired, but simple removal is fine
                };

                wrapper.appendChild(input);
                wrapper.appendChild(deleteBtn);
                guestListContainer.appendChild(wrapper);
                
                // Focus the newly added input
                input.focus();
            });

            // Logic to compile list and send to WhatsApp
            btnWhatsapp.addEventListener('click', () => {
                const inputs = guestListContainer.querySelectorAll('input');
                const validNames = [];

                inputs.forEach(input => {
                    const name = input.value.trim();
                    if (name !== '') {
                        validNames.push(name);
                    }
                });

                if (validNames.length === 0) {
                    errorMessage.classList.remove('hidden');
                    return;
                }

                // Format the message
                let message = 'Olá, confirmando presença para a festa do Heitor!\n\n*Lista de convidados:*\n';
                validNames.forEach((name, index) => {
                    message += `${index + 1}. ${name}\n`;
                });

                // Target Phone Number
                const phoneNumber = '5521994082850';
                
                // Encode the message for URL
                const encodedMessage = encodeURIComponent(message);
                
                // Construct the WhatsApp API link
                const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;
                
                // Redirect user
                window.open(whatsappUrl, '_blank');
            });
        });
    </script>
    
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
